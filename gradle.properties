# Project-wide Gradle settings.
# Optimized for Android Studio development, fast syncs, and caching.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Android & Kotlin Optimizations
android.useAndroidX=true
kotlin.code.style=official
kotlin.incremental=true
ksp.incremental=true

android.disallowKotlinSourceSets=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE